<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Galaxy</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* HEADER PRO */
header {
    background: #020617;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

/* CONTENEDOR TIPO GRID PRO */
.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 30px;
}

/* TARJETA PRO */
.manga {
    background: #1e293b;
    border-radius: 15px;
    width: 220px;
    overflow: hidden;
    transition: 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.manga:hover {
    transform: translateY(-8px);
}

/* IMAGEN PERFECTA */
.manga img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
}

/* TÍTULO */
.manga h2 {
    margin: 10px;
    font-size: 16px;
}

/* BOTÓN PRO */
button {
    width: 100%;
    border: none;
    padding: 12px;
    background: #22c55e;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #16a34a !important;
}

/* VISOR (LO DEJAMOS OCULTO) */
.reader {
    display: none;
    text-align: center;
}

.reader img {
    width: 100%;
    max-width: 800px;
    display: block;
    margin: 0 auto 10px auto;
}
</style>
</head>

<body>

<header>📚 Manga Galaxy</header>

<div class="container">

    <div class="manga">
        <h2>Sword Art Online</h2>
        <img src="https://proassetspdlcom.cdnstatics2.com/usuaris/libros/fotos/204/original/portada_sword-art-online-aincrad-n-0102_reki-kawahara_201603291554.jpg">
        <button onclick="location.href='manga1.html'">
            Ver Manga
        </button>
    </div>

    <div class="manga">
        <h2>Witch Hat Atelier</h2>
        <img src="https://m.media-amazon.com/images/I/91Uux8bBTLL.jpg">
        <button onclick="location.href='manga2.html'">
            Ver Manga
        </button>
    </div>

</div>

</body>
</html>
