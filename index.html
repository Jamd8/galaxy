<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Galaxy</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0b0f19;
    color: white;
    transition: 0.3s;
}

/* 🌞 MODO CLARO */
body.light {
    background: #f1f5f9;
    color: black;
}

/* TOP BAR */
.topbar {
    background: #111827;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    transition: 0.3s;
}

body.light .topbar {
    background: #e2e8f0;
}

/* LOGO */
.logo {
    font-size: 20px;
    font-weight: 700;
}

/* BUSCADOR */
#search {
    width: 250px;
    padding: 8px;
    border-radius: 8px;
    border: 2px solid transparent;
    outline: none;
    transition: 0.3s;
}

/* 🔴 borde rojo al click */
#search:focus {
    border: 2px solid #ef4444;
}

/* SWITCH JOYSTICK */
.switch {
    position: relative;
    width: 50px;
    height: 26px;
    margin-left: 10px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #334155;
    border-radius: 30px;
    transition: 0.3s;
}

.slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 4px;
    bottom: 4px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
}

input:checked + .slider {
    background: #22c55e;
}

input:checked + .slider::before {
    transform: translateX(24px);
}

/* CONTENEDOR */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD */
.manga {
    background: #1f2937;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
    border: 1px solid transparent;
}

body.light .manga {
    background: white;
}

.manga:hover {
    transform: translateY(-6px);
    border: 1px solid #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
}

/* IMAGEN */
.manga img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

/* TITULO PRO */
.manga h3 {
    margin: 8px;
    font-size: 16px;
    font-weight: 700;
}

/* BOTÓN */
.manga button {
    width: 100%;
    border: none;
    padding: 10px;
    background: #22c55e;
    cursor: pointer;
    font-weight: bold;
}

.manga button:hover {
    background: #16a34a;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <div class="logo">📚 Manga Library</div>

    <input type="text" id="search" placeholder="🔍 Buscar manga...">

    <!-- SWITCH JOYSTICK -->
    <label class="switch">
        <input type="checkbox" id="toggleMode">
        <span class="slider"></span>
    </label>

</div>

<!-- CATÁLOGO -->
<div class="container">

    <div class="manga">
        <img src="https://proassetspdlcom.cdnstatics2.com/usuaris/libros/fotos/204/original/portada_sword-art-online-aincrad-n-0102_reki-kawahara_201603291554.jpg">
        <h3>Sword Art Online</h3>
        <button onclick="location.href='manga1.html'">Leer</button>
    </div>

    <div class="manga">
        <img src="https://m.media-amazon.com/images/I/91Uux8bBTLL.jpg">
        <h3>Witch Hat Atelier</h3>
        <button onclick="location.href='manga2.html'">Leer</button>
    </div>

</div>

<script>

/* 🔍 BUSCADOR */
const search = document.getElementById("search");
const mangas = document.querySelectorAll(".manga");

search.addEventListener("input", () => {
    let value = search.value.toLowerCase();

    mangas.forEach(m => {
        let title = m.querySelector("h3").innerText.toLowerCase();
        m.style.display = title.includes(value) ? "block" : "none";
    });
});

/* 🌙 MODO JOYSTICK */
const toggle = document.getElementById("toggleMode");

toggle.addEventListener("change", () => {
    document.body.classList.toggle("light");
});

</script>

</body>
</html>
