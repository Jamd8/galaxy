<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Galaxy</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
}

/* TOP BAR estilo MangaDex */
.topbar {
    background: #111827;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

/* BUSCADOR */
#search {
    width: 250px;
    padding: 8px;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* CONTENIDO */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD MANGA */
.manga {
    background: #1f2937;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
    border: 1px solid transparent;
}

.manga:hover {
    transform: translateY(-6px);
    border: 1px solid #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
}

/* PORTADA */
.manga img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

/* INFO */
.manga h3 {
    margin: 8px;
    font-size: 14px;
}

/* BOTÓN */
.manga button {
    width: 100%;
    border: none;
    padding: 10px;
    background: #22c55e;
    cursor: pointer;
    font-weight: bold;
}

.manga button:hover {
    background: #16a34a;
}

/* FILTROS (tipo MangaDex) */
.filters {
    padding: 10px 20px;
    display: flex;
    gap: 10px;
}

.filter-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #334155;
    color: white;
}

.filter-btn:hover {
    background: #475569;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">📚 Manga Library</div>
    <input type="text" id="search" placeholder="🔍 Buscar manga...">
</div>

<!-- CATÁLOGO -->
<div class="container">

    <div class="manga">
        <img src="https://proassetspdlcom.cdnstatics2.com/usuaris/libros/fotos/204/original/portada_sword-art-online-aincrad-n-0102_reki-kawahara_201603291554.jpg">
        <h3>Sword Art Online</h3>
        <button onclick="location.href='manga1.html'">Leer</button>
    </div>

    <div class="manga">
        <img src="https://m.media-amazon.com/images/I/91Uux8bBTLL.jpg">
        <h3>Witch Hat Atelier</h3>
        <button onclick="location.href='manga2.html'">Leer</button>
    </div>

</div>

<script>

/* =========================
   BUSCADOR
========================= */
const search = document.getElementById("search");
const mangas = document.querySelectorAll(".manga");

search.addEventListener("input", () => {
    let value = search.value.toLowerCase();

    mangas.forEach(m => {
        let title = m.querySelector("h3").innerText.toLowerCase();
        m.style.display = title.includes(value) ? "block" : "none";
    });
});

</script>

</body>
</html>
