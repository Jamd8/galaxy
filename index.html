<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Manga</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    background: #020617;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.manga {
    background: #1e293b;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 20px;
    transition: 0.3s;
}

.manga:hover {
    transform: scale(1.02);
}

.manga img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 10px;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.reader {
    display: none;
    text-align: center;
}

.reader img {
    width: 100%;
    max-width: 800px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<header>📚 Mi Página de Manga</header>

<div class="container">

    <div class="manga">
        <h2>Mi Primer Manga</h2>
        <img src="https://via.placeholder.com/400x200" alt="">
        <button onclick="leer()">Leer Capítulo</button>
    </div>

    <div class="reader" id="reader">
        <h2>Capítulo 1</h2>
        <img src="https://via.placeholder.com/800x1200">
        <img src="https://via.placeholder.com/800x1200">
        <img src="https://via.placeholder.com/800x1200">
    </div>

</div>

<script>
function leer() {
    document.getElementById("reader").style.display = "block";
    window.scrollTo(0, document.body.scrollHeight);
}
</script>

</body>
</html>
